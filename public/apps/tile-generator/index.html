<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Tuiles Premium | POP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f6921e;
            --primary-hover: #e07f0d;
            --bg-dark: #0f111a;
            --sidebar-bg: rgba(15, 17, 26, 0.95);
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #e2e2e7;
            --text-dim: #9494a3;
            --accent-glow: rgba(246, 146, 30, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        *::-webkit-scrollbar {
            width: 4px;
        }
        *::-webkit-scrollbar-track {
            background: transparent;
        }
        *::-webkit-scrollbar-thumb {
            background-color: var(--primary);
            border-radius: 20px;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        aside {
            width: 400px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            font-weight: 900;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--text-dim);
            margin: 32px 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title:first-child { margin-top: 0; }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--border), transparent);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            opacity: 0.8;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: rgba(0, 0, 0, 0.6);
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 8px;
        }

        .type-pill {
            padding: 12px 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-dim);
            font-size: 0.7rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-pill:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-dim);
            color: white;
        }

        .type-pill.active {
            color: white;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transform: translateY(-1px);
        }

        .type-pill.semaine.active { background: #2980b9; border-color: #2980b9; }
        .type-pill.test.active { background: #c0392b; border-color: #c0392b; }
        .type-pill.pratique.active { background: #e67e22; border-color: #e67e22; }
        .type-pill.examen.active { background: #8e44ad; border-color: #8e44ad; }
        .type-pill.relache.active { background: #10b981; border-color: #10b981; }
        .type-pill.custom.active { background: var(--primary); border-color: var(--primary); }

        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            padding: 0;
            border: none;
            flex: 1;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: white;
            border: 4px solid var(--primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .range-value {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--primary);
            min-width: 45px;
            text-align: right;
            font-family: 'Orbitron', monospace;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-input-wrapper {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--border);
            transition: all 0.3s;
        }
        .color-input-wrapper:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        input[type="color"] {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 80px;
            height: 80px;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .btn-browse {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 18px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-browse:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0f 100%);
            position: relative;
            z-index: 1;
        }

        main::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            opacity: 0.03;
            pointer-events: none;
        }

        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .canvas-container {
            position: relative;
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 40px;
            border: 1px solid var(--border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
        }

        canvas#preview {
            border-radius: 24px;
            display: block;
            max-width: 100%;
            height: auto;
            background: #000;
        }

        .canvas-controls {
            position: absolute;
            bottom: -80px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-premium {
            padding: 16px 32px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            font-family: 'Outfit', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(246, 146, 30, 0.2);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(246, 146, 30, 0.4);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
        }

        .gallery-area {
            height: 280px;
            background: rgba(18, 18, 26, 0.6);
            backdrop-filter: blur(30px);
            border-top: 1px solid var(--border);
            padding: 32px 48px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gallery-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        .gallery-scroll {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding-bottom: 20px;
            flex: 1;
            scroll-behavior: smooth;
        }

        .gallery-item {
            min-width: 220px;
            height: 147px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .gallery-item:hover {
            border-color: var(--primary);
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 60%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12px;
            gap: 12px;
            opacity: 0;
            transition: all 0.3s;
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .icon-btn:hover { transform: scale(1.2); }
        .icon-btn.download { background: #10b981; }
        .icon-btn.delete { background: #c0392b; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .modal-container {
            background: #12121e;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            border-radius: 32px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 60px 120px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 32px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: white;
            letter-spacing: 2px;
        }

        .modal-close {
            background: rgba(255,255,255,0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border);
            color: white;
        }
        .modal-close:hover {
            background: #c0392b;
            border-color: #c0392b;
        }

        .modal-search {
            padding: 24px 48px;
            display: flex;
            gap: 20px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }

        .icon-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            padding: 40px 48px;
            overflow-y: auto;
        }

        .icon-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .icon-box:hover {
            background: rgba(246, 146, 30, 0.05);
            border-color: var(--primary);
            transform: translateY(-8px);
        }
        .icon-box i { font-size: 2.2rem; color: var(--text-main); }
        .icon-box span { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

        .empty-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--border);
            gap: 16px;
        }
        .empty-placeholder i { font-size: 3rem; }

        .chip-group {
            display: flex;
            gap: 10px;
        }

        .chip {
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside>
            <div class="sidebar-header">
                <i class="fas fa-magic" style="color: var(--primary); font-size: 1.4rem;"></i>
                <h1>POPTiles</h1>
            </div>
            
            <div class="sidebar-content">
                <div class="section-title">Concept & Sujet</div>
                
                <div class="form-group">
                    <label>Modèle de section</label>
                    <div class="type-grid">
                        <div class="type-pill semaine active" data-type="semaine">Semaine</div>
                        <div class="type-pill test" data-type="test">Test</div>
                        <div class="type-pill pratique" data-type="pratique">Pratique</div>
                        <div class="type-pill examen" data-type="examen">Examen</div>
                        <div class="type-pill relache" data-type="relache">Relâche</div>
                        <div class="type-pill custom" data-type="custom">Custom</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="title">Titre supérieur</label>
                    <input type="text" id="title" placeholder="Ex: Semaine 1, Chapitre 3...">
                </div>

                <div class="form-group">
                    <label for="subject">Sujet principal</label>
                    <textarea id="subject" placeholder="Ex: Structure de la cellule&#10;et organites" rows="3"></textarea>
                </div>

                <div class="section-title">Atmosphère & Styles</div>

                <div class="form-group">
                    <label>Orientation du dégradé</label>
                    <div class="slider-wrapper">
                        <input type="range" id="angle" min="0" max="180" value="45">
                        <span class="range-value" id="angleValue">45°</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Palette de couleurs</label>
                    <div class="color-row">
                        <div class="color-input-wrapper"><input type="color" id="color1" value="#2980b9"></div>
                        <i class="fas fa-bolt-lightning" style="font-size: 0.8rem; color: var(--primary); opacity: 0.5;"></i>
                        <div class="color-input-wrapper"><input type="color" id="color2" value="#8e44ad"></div>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-left: auto;">
                            <input type="checkbox" id="useCustomColors" style="width: 16px; height: 16px;">
                            <span style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase;">Libre</span>
                        </label>
                    </div>
                </div>

                <div class="section-title">Signature Visuelle</div>

                <div class="form-group">
                    <label>Icône interactive</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="text" id="iconSearchInput" placeholder="Chercher une icône..." readonly style="cursor: pointer; flex: 1;" onclick="openIconModal()">
                        <button class="btn-browse" onclick="openIconModal()">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <input type="hidden" id="iconClass" value="fas fa-book">
                </div>

                <div class="form-group">
                    <label>Teinte & Transparence</label>
                    <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 20px;">
                        <div class="color-input-wrapper"><input type="color" id="iconColor" value="#ffffff"></div>
                        <div class="slider-wrapper" style="flex: 1;">
                            <input type="range" id="iconOpacity" min="0" max="100" value="100">
                            <span class="range-value" id="iconOpacityValue">1.0</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Échelle de l'icône</label>
                    <div class="slider-wrapper">
                        <i class="fas fa-minus" style="font-size: 0.7rem; color: var(--text-dim);"></i>
                        <input type="range" id="iconSize" min="10" max="400" value="80">
                        <i class="fas fa-plus" style="font-size: 0.7rem; color: var(--text-dim);"></i>
                        <span class="range-value" id="iconSizeValue">80px</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Point d'ancrage</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <select id="iconHPos">
                            <option value="left">Gauche</option>
                            <option value="center" selected>Centre</option>
                            <option value="right">Droite</option>
                        </select>
                        <select id="iconVPos">
                            <option value="top">Haut</option>
                            <option value="mid" selected>Milieu</option>
                            <option value="bottom">Bas</option>
                        </select>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main>
            <div class="preview-area">
                <div class="canvas-container">
                    <canvas id="preview" width="300" height="200"></canvas>
                    <div class="canvas-controls">
                        <button class="btn-premium btn-outline" onclick="downloadCurrent()">
                            <i class="fas fa-file-export"></i> Exporter la Tuile
                        </button>
                        <button class="btn-premium btn-primary" onclick="addToList()">
                            <i class="fas fa-folder-plus"></i> Collectionner
                        </button>
                    </div>
                </div>
            </div>

            <div class="gallery-area">
                <div class="gallery-header">
                    <h3>Atelier de Collection</h3>
                    <button class="btn-premium btn-outline" style="padding: 10px 24px; font-size: 0.75rem; border-radius: 12px;" onclick="downloadAll()">
                        <i class="fas fa-archive"></i> Pack ZIP Complet
                    </button>
                </div>
                <div class="gallery-scroll" id="tilesList">
                    <div class="empty-placeholder">
                        <i class="fas fa-meteor"></i>
                        <p style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Aucune tuile générée pour le moment</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal d'icônes -->
    <div id="iconModal" class="modal">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Bibliothèque d'icônes Intelligente</h2>
                <div class="modal-close" onclick="closeIconModal()"><i class="fas fa-times"></i></div>
            </div>
            <div class="modal-search">
                <input type="text" id="modalSearch" placeholder="Rechercher par tag (ex: atom, music, globe...)" oninput="filterModalIcons()" style="flex: 1;">
                <div class="chip-group">
                    <div class="chip active" data-style="all" onclick="setStyleFilter('all')">Tous</div>
                    <div class="chip" data-style="solid" onclick="setStyleFilter('solid')">Solid</div>
                    <div class="chip" data-style="regular" onclick="setStyleFilter('regular')">Regular</div>
                    <div class="chip" data-style="brands" onclick="setStyleFilter('brands')">Brands</div>
                </div>
            </div>
            <div id="iconGrid" class="icon-grid">
                <!-- Icons generated here -->
            </div>
        </div>
    </div>

    <i id="icon-proxy" class="" style="position: absolute; left: -9999px; visibility: hidden;"></i>

    <script src="icons_data.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const canvas = document.getElementById('preview');
        const ctx = canvas.getContext('2d');

        const WIDTH = 300;
        const HEIGHT = 200;
        const MARGIN_SIDE = 25;
        const TOP_ZONE = 55;
        const CENTER_ZONE = 90;

        let currentType = 'semaine';
        let tilesList = [];
        
        // Icon state
        let iconClass = 'fas fa-book';
        let iconColor = '#ffffff';
        let iconSize = 80;
        let iconOpacity = 1;
        let iconHPos = 'center';
        let iconVPos = 'mid';

        const colorSchemes = {
            semaine: [
                ['#2980b9', '#8e44ad'], ['#2ecc71', '#27ae60'], ['#3498db', '#2980b9'],
                ['#9b59b6', '#8e44ad'], ['#1abc9c', '#16a085'], ['#34495e', '#2c3e50']
            ],
            test: [['#e74c3c', '#c0392b']],
            pratique: [['#f39c12', '#e67e22']],
            examen: [['#c0392b', '#8e44ad']],
            relache: [['#2ecc71', '#1abc9c']],
            custom: [['#f6921e', '#1a1a2e']]
        };

        let colorIndex = 0;
        let modalStyleFilter = 'all';

        // --- Core Functions ---

        function updatePreview() {
            // Draw Background
            const c1 = document.getElementById('color1').value;
            const c2 = document.getElementById('color2').value;
            const angle = parseInt(document.getElementById('angle').value);
            
            drawGradient(ctx, WIDTH, HEIGHT, c1, c2, angle);
            drawDiagonalLines(ctx, WIDTH, HEIGHT, 25, 0.08);

            // Draw Icon
            const iconInfo = getIconInfo(iconClass);
            if (iconInfo) {
                ctx.save();
                ctx.globalAlpha = iconOpacity;
                ctx.fillStyle = iconColor;
                ctx.font = `${iconInfo.weight} ${iconSize}px "${iconInfo.family}"`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                let x = WIDTH / 2;
                let y = HEIGHT / 2;

                if (iconHPos === 'left') x = MARGIN_SIDE + iconSize/4;
                if (iconHPos === 'right') x = WIDTH - MARGIN_SIDE - iconSize/4;
                if (iconVPos === 'top') y = TOP_ZONE + iconSize/4;
                if (iconVPos === 'bottom') y = HEIGHT - MARGIN_SIDE - iconSize/4;

                // Add glass shadow to icon
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 15;
                ctx.fillText(iconInfo.char, x, y);
                ctx.restore();
            }

            // Draw Text
            const title = document.getElementById('title').value;
            const subject = document.getElementById('subject').value;
            drawCustomText(ctx, title, subject, WIDTH, HEIGHT);
        }

        function drawGradient(ctx, width, height, color1, color2, angle) {
            const angleRad = angle * Math.PI / 180;
            const x1 = width / 2 - Math.cos(angleRad) * width / 2;
            const y1 = height / 2 - Math.sin(angleRad) * height / 2;
            const x2 = width / 2 + Math.cos(angleRad) * width / 2;
            const y2 = height / 2 + Math.sin(angleRad) * height / 2;

            const grad = ctx.createLinearGradient(x1, y1, x2, y2);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawDiagonalLines(ctx, width, height, spacing, opacity) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
            ctx.lineWidth = 1;
            for (let i = -height; i < width + height; i += spacing) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + height, height);
                ctx.stroke();
            }
        }

        function drawCustomText(ctx, title, subject, width, height) {
            const maxW = width - (MARGIN_SIDE * 2);
            
            // Title
            if (title) {
                ctx.font = 'bold 18px "Inter", sans-serif';
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.fillText(title, MARGIN_SIDE, 35);
            }

            // Subject (Multi-line)
            if (subject) {
                let fs = 26;
                ctx.font = `800 ${fs}px "Outfit", sans-serif`;
                const lines = subject.split('\n');
                const lineHeight = fs * 1.1;
                const totalH = lines.length * lineHeight;
                
                let startY = TOP_ZONE + (CENTER_ZONE - totalH)/2 + fs/2;
                
                lines.forEach((line, i) => {
                    ctx.textAlign = 'center';
                    ctx.fillText(line, width/2, startY + (i * lineHeight));
                });
            }
            // Reset shadows
            ctx.shadowBlur = 0;
        }

        function getIconInfo(cls) {
            const p = document.getElementById('icon-proxy');
            p.className = cls;
            const style = window.getComputedStyle(p, '::before');
            const content = style.getPropertyValue('content').replace(/['"]/g, '');
            if (!content || content === 'none') return null;
            return { 
                char: content, 
                family: window.getComputedStyle(p).getPropertyValue('font-family').replace(/['"]/g, ''),
                weight: window.getComputedStyle(p).getPropertyValue('font-weight')
            };
        }

        // --- Interaction Logic ---

        document.querySelectorAll('.type-pill').forEach(pill => {
            pill.onclick = () => {
                document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentType = pill.dataset.type;
                
                if (currentType !== 'custom' && !document.getElementById('useCustomColors').checked) {
                    const scheme = colorSchemes[currentType][0];
                    document.getElementById('color1').value = scheme[0];
                    document.getElementById('color2').value = scheme[1];
                }
                updatePreview();
            };
        });

        const inputs = ['title', 'subject', 'angle', 'color1', 'color2', 'iconColor', 'iconOpacity', 'iconSize', 'iconHPos', 'iconVPos'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                if (id === 'angle') document.getElementById('angleValue').textContent = document.getElementById('angle').value + '°';
                if (id === 'iconOpacity') {
                    iconOpacity = document.getElementById('iconOpacity').value / 100;
                    document.getElementById('iconOpacityValue').textContent = iconOpacity.toFixed(1);
                }
                if (id === 'iconSize') {
                    iconSize = parseInt(document.getElementById('iconSize').value);
                    document.getElementById('iconSizeValue').textContent = iconSize + 'px';
                }
                updatePreview();
            });
        });

        function openIconModal() { document.getElementById('iconModal').style.display = 'flex'; renderIconGrid(FA_FREE_ICONS); }
        function closeIconModal() { document.getElementById('iconModal').style.display = 'none'; }

        function renderIconGrid(icons) {
            const grid = document.getElementById('iconGrid');
            grid.innerHTML = '';
            
            if (icons.length === 0) {
                grid.innerHTML = `<div class="empty-placeholder" style="grid-column: 1/-1; padding: 40px;">
                    <i class="fas fa-search"></i>
                    <p>Aucune icône trouvée</p>
                </div>`;
                return;
            }

            icons.slice(0, 400).forEach(icon => {
                const box = document.createElement('div');
                box.className = 'icon-box';
                box.innerHTML = `<i class="${icon.class}"></i><span>${icon.label}</span>`;
                box.onclick = () => {
                    iconClass = icon.class;
                    document.getElementById('iconSearchInput').value = icon.label;
                    updatePreview();
                    closeIconModal();
                };
                grid.appendChild(box);
            });
        }

        function filterModalIcons() {
            const q = document.getElementById('modalSearch').value.toLowerCase();
            const filtered = FA_FREE_ICONS.filter(i => 
                (modalStyleFilter === 'all' || i.style === modalStyleFilter) &&
                (i.label.toLowerCase().includes(q) || i.search.some(s => s.toLowerCase().includes(q)))
            );
            renderIconGrid(filtered);
        }

        function setStyleFilter(s) {
            modalStyleFilter = s;
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.style === s));
            filterModalIcons();
        }

        function addToList() {
            const dataUrl = canvas.toDataURL('image/png');
            const id = Date.now();
            tilesList.push({ id, dataUrl, name: `${document.getElementById('title').value || 'Tuile'}_${id}` });
            renderGallery();
        }

        function renderGallery() {
            const container = document.getElementById('tilesList');
            if (tilesList.length === 0) {
                container.innerHTML = '<div class="empty-placeholder"><i class="fas fa-meteor"></i><p>Collection vide</p></div>';
                return;
            }
            container.innerHTML = '';
            tilesList.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.dataUrl}">
                    <div class="item-overlay">
                        <button class="icon-btn download" onclick="downloadItem('${item.dataUrl}', '${item.name}')"><i class="fas fa-download"></i></button>
                        <button class="icon-btn delete" onclick="deleteItem(${item.id})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function deleteItem(id) {
            tilesList = tilesList.filter(t => t.id !== id);
            renderGallery();
        }

        function downloadItem(url, name) {
            const a = document.createElement('a');
            a.href = url;
            a.download = name + '.png';
            a.click();
        }

        function downloadCurrent() {
            downloadItem(canvas.toDataURL('image/png'), document.getElementById('title').value || 'tuile_pop');
        }

        async function downloadAll() {
            const zip = new JSZip();
            tilesList.forEach(t => {
                const b64 = t.dataUrl.split(',')[1];
                zip.file(t.name + ".png", b64, {base64: true});
            });
            const content = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = "pop_collection.zip";
            a.click();
        }

        // Init
        setTimeout(() => {
            updatePreview();
        }, 500);
    </script>
</body>
</html>
